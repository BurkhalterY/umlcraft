name: Release

# Builds every installer: Windows (MSI + portable zip, x64 and arm64), macOS (universal DMG + zip),
# Linux (AppImage, deb, rpm, tar.gz, x86_64 and aarch64) and FreeBSD (pkg + tar.gz).
#
# Every night, when `main` has commits since the last `vX.Y.Z` tag, it publishes the next release.
# The version comes from the Conventional Commits since that tag (packaging/next-version.sh):
# a breaking change bumps the minor number while UMLCraft is 0.x, anything else the patch number.
# A manual run publishes the same way right away; with "dry run" it only builds and keeps the
# installers as workflow artifacts. A release that already exists is never overwritten.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to compute the version
      - name: Next version
        id: v
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            v="$(packaging/next-version.sh --always)"
            publish=false
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main only; use a dry run on other branches."
            exit 1
          else
            v="$(packaging/next-version.sh)"
            publish=true
          fi
          if [ -z "$v" ]; then
            echo "No commit since the last release: nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            publish=false
          else
            echo "Version: $v (publish: $publish)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        run: packaging/set-version.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev fonts-liberation \
            desktop-file-utils file
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # the last appimagetool and runtime that downloaded, used when GitHub release downloads fail
      - name: Restore the AppImage tools
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/appimage-tools
          key: appimage-tools-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: appimage-tools-${{ matrix.arch }}-
      - name: Install the AppImage tools
        run: |
          tools="$HOME/.cache/appimage-tools"
          packaging/linux/fetch-appimage-tools.sh "${{ matrix.arch }}" "$tools"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec "%s/appimagetool.AppImage" --appimage-extract-and-run "$@"\n' "$tools" > "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Save the AppImage tools
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/appimage-tools
          key: appimage-tools-${{ matrix.arch }}-${{ github.run_id }}
      - name: Test
        run: cargo test --release
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: APPIMAGE_RUNTIME="$HOME/.cache/appimage-tools/runtime" packaging/linux/package.sh
      - name: Check the packages
        run: |
          desktop-file-validate packaging/linux/io.github.burkhaltery.UMLCraft.desktop
          ls dist/release/*.AppImage dist/release/*.deb dist/release/*.rpm dist/release/*.tar.gz
          dpkg-deb --info dist/release/*.deb
          file dist/release/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        run: packaging/set-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: packaging/macos/import-cert.sh
      - name: Build, sign, package (DMG, zip)
        run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always() && env.APPLE_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/umlcraft-signing.keychain-db" || true

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        shell: pwsh
        run: |
          # the same as packaging/set-version.sh: the first `version = "..."` line of Cargo.toml
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::new('(?m)^version = ".*"').Replace($toml, "version = `"$env:VERSION`"", 1)
          Set-Content -Path Cargo.toml -Value $toml -NoNewline
          Select-String -Path Cargo.toml -Pattern '^version = ' | Select-Object -First 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build, sign, package (MSI, portable zip)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD x86_64
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set the version
        run: packaging/set-version.sh # before the VM step, which copies the workspace
      # The action downloads its VM launcher from GitHub releases, which sometimes answers HTTP 504
      # for a while: when the first attempt fails, wait and try once more.
      - name: Build and package in a FreeBSD VM (pkg, tar.gz)
        id: vm
        continue-on-error: true
        uses: vmactions/freebsd-vm@v1
        with:
          envs: VERSION
          usesh: true
          prepare: pkg install -y bash rust pkgconf gtk3 libxkbcommon mesa-libs fontconfig
          run: bash packaging/freebsd/package.sh
      - name: Wait before the second attempt
        if: steps.vm.outcome == 'failure'
        run: sleep 120
      - name: Build and package in a FreeBSD VM, second attempt
        if: steps.vm.outcome == 'failure'
        uses: vmactions/freebsd-vm@v1
        with:
          envs: VERSION
          usesh: true
          prepare: pkg install -y bash rust pkgconf gtk3 libxkbcommon mesa-libs fontconfig
          run: bash packaging/freebsd/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, linux, macos, windows, freebsd]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits since the last tag, for the release notes
      - name: Release notes
        run: |
          v="$(packaging/next-version.sh --notes "$RUNNER_TEMP/notes.md")"
          if [ "$v" != "$VERSION" ]; then
            echo "::error::Version changed during the run ($VERSION, now $v)."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        run: |
          tag="v$VERSION"
          # a published release is never changed: stop instead of overwriting its files
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; it is left unchanged."
            exit 1
          fi
          # creates the tag on the built commit; a tag pushed with this token starts no workflow
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "UMLCraft $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
