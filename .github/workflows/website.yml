# Builds website/ and publishes it on GitHub Pages.
#
# It runs when the site or the data it reads changes on main, after each release
# (so the download links point at the new version), and on demand.
name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/features/**
      - docs/images/**
      - packaging/icons/**
      - .github/workflows/website.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a release run, only rebuild if it succeeded on main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
