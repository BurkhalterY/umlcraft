[package]
name = "umlcraft"
version = "0.1.0"
edition = "2021"
description = "A UML modeler that reads and writes StarUML .mdj project files"
license = "MIT"

[[bin]]
name = "umlcraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
egui = "0.36.2"
serde = "1"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
