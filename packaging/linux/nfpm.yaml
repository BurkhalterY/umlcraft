# deb and rpm description for nfpm (https://nfpm.goreleaser.com); paths are relative to the repository root
name: umlcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Yannis Burkhalter <yannis@burkhalter.dev>
description: |
  UML modeler for class and use case diagrams.
  UMLCraft opens and saves .mdj model files, keeping everything it does not edit exactly as it was.
vendor: UMLCraft
homepage: https://github.com/BurkhalterY/umlcraft
license: MIT
contents:
  - src: dist/staging/usr/
    dst: /usr/
    type: tree
overrides:
  deb:
    depends: [libgtk-3-0 | libgtk-3-0t64, libgl1, libxkbcommon0, fontconfig]
    recommends: [fonts-liberation]
  rpm:
    depends: [gtk3, mesa-libGL, libxkbcommon, fontconfig]
    recommends: [liberation-sans-fonts]
scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
